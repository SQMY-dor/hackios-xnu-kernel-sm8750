# OnePlus 13 (dodge), Qualcomm SM8750 "Snapdragon 8 Elite".
# Sources: docs/port-sm8750/FACTS.md (verified addresses) and docs/port-sm8750/loader.md (the
# reasoning behind each value). Nothing here has been run on a phone: there is no dodge hardware
# in this environment, so every value is "built / checked statically", never "booted".
NAME="OnePlus 13 (dodge)"
KIND=phone
SOC="Qualcomm Snapdragon 8 Elite (SM8750)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Mu-Silicium upstream already has Platforms/OnePlus/dodgePkg, so the UEFI port is upstream's
# package plus our two boot-chain changes (uefi/mu-silicium.patch). See docs/port-sm8750/loader.md.
UEFI_TARGET=dodge
UEFI_FD=
# The phone's own vendor device tree, kept in the repository (82245 bytes, from Mu-Silicium
# Platforms/OnePlus/dodgePkg/FdtBlob/sm8750-oneplus-dodge.dtb). The same file is also the copy the
# UEFI port builds into the firmware.
DTB=uefi/files/Resources/DTBs/dodge.dtb
# From Mu-Silicium Resources/Configs/dodge.toml [uefi_fd] (base 0xA7100000, size 0x300000), which is
# the UEFI_FD entry of dodgePkg/Library/MemoryMapLib/MemoryMapLib.c. 0xA7100000+0x300000 = 0xA7400000
# is well below PAYLOAD_BASE; UEFI_FD_Reserved follows it at 0xA7400000/0x200000.
FD_BASE=0xA7100000
FD_SIZE=0x300000
# Unchanged from redwood: 0xF0000000..0xF4000000 is free in the dodge UEFI map (between the end of
# DXE_Heap and Display_Reserved at 0xFC800000). It is also hardcoded as XNU_PAYLOAD_BASE in
# uefi/files/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.h, so moving it would
# mean changing that header too. Keep it.
PAYLOAD_BASE=0xF0000000

# --- kernel and loader -----------------------------------------------------------------------------
# INFERRED, not observed: the dodge MemoryMapLib reserves 0xFC800000/0x02B00000 as
# "Display_Reserved", which is where SimpleFbDxe puts the GOP framebuffer, so the UEFI is expected
# to report fb_base 0xFC800000. It must stay equal to platform_dodge.fb_base in xnuloader/loader.c
# (that value is how the loader tells dodge from redwood and from QEMU's ramfb). Confirming it needs
# one on-hardware read of the loader's own "display 1440 x 3168 at ..." line; if it differs, change
# both places.
FB_BASE=0xFC800000
# SM8750 has a WCN7850 (ath12k), not the WCN6750 (ath11k) redwood's driver was written for.
WIFI_ATH11K=0

# --- what the run needs ----------------------------------------------------------------------------
# First milestone: the loader's own screen and log over USB, then the kernel's verbose boot with the
# framebuffer, the timer and its own cores -- nothing else. Deliberately left out:
#   touchscreen   redwood's driver is a Goodix GT9916 over bit-banged SPI; dodge's panel is a
#                 Synaptics S3910 on spi@a90000 (QUP2 SE), a different chip and a different protocol;
#   gpu           Adreno 830, where redwood_adreno.c drives the Adreno 642L (a660 firmware names);
#   cpufreq       SM8750 has no cpufreq/EPSS node yet (neither mainline nor the vendor DT), so the
#                 EPSS address a driver would program is unverified: docs/port-sm8750/kernel.md;
#   wifi, adsp    WCN7850 (ath12k) and SM8750's ADSP are out of scope for milestone 1.
# bootcpu= is not used either: dodge's eight Oryon cores are numbered 0-5 (performance cluster) and
# 6,7 (prime cluster), and which one a kernel should start on is a judgement to make with the phone.
BOOTARGS="cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
# Empty on purpose -- none of it is needed for milestone 1. Expect different files from redwood's:
# Adreno 830 GMU/ZAP (fw-gpu), WCN7850 wpss (fw-wifi), SM8750 adsp (fw-audio).
FIRMWARE=""
